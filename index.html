<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1366, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Cuaderno</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --w: 1366px;
  --h: 100dvh;
  --header-h: 72px;
  
  --bg-app: #f0ebe5;
  --header-bg: #e9e9e7;
  --border-header: #d4d4d2;
  
  --sel-h: 44px;
  --sel-radius: 22px;
  --sel-border: 3.5px;
  --sel-color: #9a9a98;
  
  --card-radius: 16px;
  --card-padding: 16px;
  --card-border-w: 3.5px;
  --card-bg: #ffffff;
  
  --font: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
}

html, body {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg-app);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ===== HEADER / BARRA DE HERRAMIENTAS ===== */
header {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: var(--header-h);
  background: var(--header-bg);
  border-bottom: 1px solid var(--border-header);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  gap: 20px;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}

.selector {
  height: var(--sel-h);
  border-radius: var(--sel-radius);
  border: var(--sel-border) solid #c8c8c6;
  background: #ffffff;
  padding: 0 16px;
  font-size: 14px;
  color: var(--sel-color);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  text-transform: uppercase;
}

.selector:hover {
  border-color: #a8a8a6;
}

.selector.active {
  color: #2a2a28;
  border-color: #888886;
  background: #f9f9f7;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: var(--sel-border) solid #b8b8b6;
  background: #ffffff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.btn:hover {
  border-color: #888886;
  background: #f9f9f7;
}

.btn.active {
  border-color: #88cc00;
  background: #f0ff80;
  box-shadow: 0 0 8px rgba(136, 204, 0, 0.4);
}

/* ===== EDITOR BORDES ===== */
.editor-bordes {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border-left: 1px solid var(--border-header);
}

.borde-opcion {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 2px solid #d4d4d2;
  background: #ffffff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: all 0.15s;
}

.borde-opcion:hover {
  border-color: #888886;
}

.borde-opcion.active {
  border-color: #88cc00;
  background: #f0ff80;
  box-shadow: 0 0 8px rgba(136, 204, 0, 0.4);
}

/* ===== MESA / VIEWPORT ===== */
#mesa {
  position: absolute;
  top: var(--header-h);
  left: 0;
  width: 100%;
  height: calc(100dvh - var(--header-h));
  background: var(--bg-app);
  overflow: hidden;
  touch-action: none;
  perspective: 1000px;
}

/* ===== TARJETAS ===== */
.card {
  position: absolute;
  background: var(--card-bg);
  border-radius: var(--card-radius);
  padding: var(--card-padding);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  
  /* Default: borde simple gris */
  border: var(--card-border-w) solid #d4d4d2;
  
  /* Sombra sutil */
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  
  transition: box-shadow 0.1s, transform 0.1s;
}

.card:active {
  cursor: grabbing;
}

.card.selected {
  box-shadow: 0 0 12px rgba(136, 204, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.12);
}

/* Tipos de bordes predefinidos */
.card.borde-simple {
  border: var(--card-border-w) solid #d4d4d2;
}

.card.borde-punteado {
  border: var(--card-border-w) dashed #8a8a88;
}

.card.borde-doble {
  border: var(--card-border-w) double #b8b8b6;
}

.card.borde-grosor {
  border: 6px solid #6b6b69;
}

.card.borde-color-a {
  border: var(--card-border-w) solid #C85A54;
}

.card.borde-color-b {
  border: var(--card-border-w) solid #1E3A8A;
}

.card.borde-color-c {
  border: var(--card-border-w) solid #6FCF3D;
}

.card.borde-gradient {
  border: var(--card-border-w) solid transparent;
  background:
    linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
    linear-gradient(135deg, #8557D4, #CCB0E3) border-box;
}

/* Contenedor de columnas */
.card-grid {
  display: grid;
  gap: 8px;
  width: 100%;
}

.card-grid.cols-1 { grid-template-columns: 1fr; }
.card-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.card-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

.cell {
  background: #f9f9f7;
  border: 1px solid #e0e0de;
  border-radius: 8px;
  padding: 8px;
  font-size: 12px;
  color: #6a6a68;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  word-break: break-word;
}

/* ===== PANEL DERECHO (EDITOR DETALLES) ===== */
.panel-derecho {
  position: fixed;
  right: 0;
  top: var(--header-h);
  width: 280px;
  height: calc(100dvh - var(--header-h));
  background: #f9f9f7;
  border-left: 1px solid var(--border-header);
  padding: 16px;
  overflow-y: auto;
  z-index: 50;
  box-shadow: -2px 0 8px rgba(0, 0, 0, 0.05);
}

.panel-derecho.hidden {
  display: none;
}

.panel-section {
  margin-bottom: 20px;
}

.panel-label {
  font-size: 12px;
  font-weight: 700;
  color: #6a6a68;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.panel-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.panel-btn {
  flex: 1;
  min-width: 60px;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #d4d4d2;
  background: #ffffff;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}

.panel-btn:hover {
  border-color: #888886;
  background: #f0f0ee;
}

.panel-btn.active {
  border-color: #88cc00;
  background: #f0ff80;
  color: #3a3a38;
  font-weight: 600;
}

</style>

</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="header-left">
    <select id="selUnidad" class="selector">
      <option value="A">Unidad A</option>
      <option value="B">Unidad B</option>
      <option value="C">Unidad C</option>
    </select>
    
    <select id="selTema" class="selector">
      <option value="1">Tema 1</option>
      <option value="2">Tema 2</option>
    </select>
  </div>
  
  <div class="header-right">
    <button class="btn" id="btnAddCard" title="Agregar tarjeta">➕</button>
    <button class="btn" id="btnToggleEditor" title="Toggle editor">✏️</button>
  </div>
</header>

<!-- ===== PANEL EDITOR (DERECHA) ===== -->
<div class="panel-derecho hidden" id="panelEditor">
  <div class="panel-section">
    <div class="panel-label">Bordes</div>
    <div class="panel-buttons">
      <button class="panel-btn" data-borde="borde-simple">Simple</button>
      <button class="panel-btn" data-borde="borde-punteado">Punteado</button>
      <button class="panel-btn" data-borde="borde-doble">Doble</button>
      <button class="panel-btn" data-borde="borde-grosor">Grueso</button>
      <button class="panel-btn" data-borde="borde-color-a">Rojo</button>
      <button class="panel-btn" data-borde="borde-color-b">Azul</button>
      <button class="panel-btn" data-borde="borde-color-c">Verde</button>
      <button class="panel-btn" data-borde="borde-gradient">Gradiente</button>
    </div>
  </div>
  
  <div class="panel-section">
    <div class="panel-label">Aplicar a</div>
    <div class="panel-buttons">
      <button class="panel-btn" id="btnAplicarUna">Esta tarjeta</button>
      <button class="panel-btn" id="btnAplicarTodas">Todas en tema</button>
    </div>
  </div>
  
  <div class="panel-section">
    <div class="panel-label">Columnas</div>
    <div class="panel-buttons">
      <button class="panel-btn" data-cols="1">1</button>
      <button class="panel-btn" data-cols="2">2</button>
      <button class="panel-btn" data-cols="3">3</button>
    </div>
  </div>
</div>

<!-- ===== MESA (VIEWPORT) ===== -->
<div id="mesa"></div>

<script>
// ===== CONFIG =====
const UNIDADES = ['A', 'B', 'C'];
const TEMAS_POR_UNIDAD = 2;
const BORDER_STYLES = [
  'borde-simple', 'borde-punteado', 'borde-doble', 'borde-grosor',
  'borde-color-a', 'borde-color-b', 'borde-color-c', 'borde-gradient'
];

// ===== STATE =====
let state = {
  unidadActual: 'A',
  temaActual: '1',
  editorActivo: false,
  tarjetaSeleccionada: null,
  bordeSeleccionado: null,
  colsSeleccionadas: 1,
  aplicarA: 'una', // 'una' o 'todas'
  
  // Datos: { [unidad]: { [tema]: [ { id, x, y, scale, borde, cols, contenido: [[], [], ...] } ] } }
  datos: {}
};

// ===== INIT =====
function init() {
  initData();
  renderCards();
  setupEventListeners();
}

function initData() {
  UNIDADES.forEach(u => {
    state.datos[u] = {};
    for (let i = 1; i <= TEMAS_POR_UNIDAD; i++) {
      state.datos[u][i] = [];
    }
  });
  loadFromStorage();
}

function setupEventListeners() {
  // Selectores
  document.getElementById('selUnidad').addEventListener('change', (e) => {
    state.unidadActual = e.target.value;
    state.tarjetaSeleccionada = null;
    renderCards();
  });
  
  document.getElementById('selTema').addEventListener('change', (e) => {
    state.temaActual = e.target.value;
    state.tarjetaSeleccionada = null;
    renderCards();
  });
  
  // Botones
  document.getElementById('btnAddCard').addEventListener('click', addCard);
  document.getElementById('btnToggleEditor').addEventListener('click', toggleEditor);
  
  // Panel editor - bordes
  document.querySelectorAll('[data-borde]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      state.bordeSeleccionado = e.target.dataset.borde;
      updateBordeButtons();
      if (state.tarjetaSeleccionada) {
        aplicarBorde();
      }
    });
  });
  
  // Panel editor - columnas
  document.querySelectorAll('[data-cols]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      state.colsSeleccionadas = parseInt(e.target.dataset.cols);
      updateColsButtons();
      if (state.tarjetaSeleccionada) {
        aplicarCols();
      }
    });
  });
  
  // Panel editor - aplicar a
  document.getElementById('btnAplicarUna').addEventListener('click', () => {
    state.aplicarA = 'una';
    updateAplicarButtons();
  });
  
  document.getElementById('btnAplicarTodas').addEventListener('click', () => {
    state.aplicarA = 'todas';
    updateAplicarButtons();
  });
  
  // Mesa
  const mesa = document.getElementById('mesa');
  let touchStartDistance = 0;
  
  mesa.addEventListener('touchstart', handleTouchStart);
  mesa.addEventListener('touchmove', handleTouchMove);
  mesa.addEventListener('touchend', handleTouchEnd);
}

// ===== AGREGAR TARJETA =====
function addCard() {
  const tarjetas = state.datos[state.unidadActual][state.temaActual];
  const id = Date.now();
  const newCard = {
    id,
    x: 50 + Math.random() * 200,
    y: 100 + Math.random() * 200,
    scale: 1,
    borde: 'borde-simple',
    cols: 1,
    contenido: [['Tarjeta ' + id]]
  };
  tarjetas.push(newCard);
  selectCard(id);
  renderCards();
  saveToStorage();
}

// ===== RENDERIZAR =====
function renderCards() {
  const mesa = document.getElementById('mesa');
  mesa.innerHTML = '';
  
  const tarjetas = state.datos[state.unidadActual][state.temaActual] || [];
  
  tarjetas.forEach(card => {
    const cardEl = document.createElement('div');
    cardEl.className = `card ${card.borde}`;
    if (state.tarjetaSeleccionada === card.id) {
      cardEl.classList.add('selected');
    }
    
    cardEl.style.left = card.x + 'px';
    cardEl.style.top = card.y + 'px';
    cardEl.style.transform = `scale(${card.scale})`;
    cardEl.dataset.id = card.id;
    
    // Grid
    const grid = document.createElement('div');
    grid.className = `card-grid cols-${card.cols}`;
    
    for (let i = 0; i < card.cols; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = card.contenido[i]?.[0] || '';
      grid.appendChild(cell);
    }
    
    cardEl.appendChild(grid);
    
    // Eventos
    cardEl.addEventListener('click', () => selectCard(card.id));
    
    mesa.appendChild(cardEl);
  });
}

// ===== SELECCIONAR TARJETA =====
function selectCard(id) {
  state.tarjetaSeleccionada = id;
  const tarjeta = state.datos[state.unidadActual][state.temaActual].find(c => c.id === id);
  if (tarjeta) {
    state.bordeSeleccionado = tarjeta.borde;
    state.colsSeleccionadas = tarjeta.cols;
    updateBordeButtons();
    updateColsButtons();
  }
  renderCards();
}

// ===== BORDES =====
function aplicarBorde() {
  if (!state.tarjetaSeleccionada || !state.bordeSeleccionado) return;
  
  const tarjetas = state.datos[state.unidadActual][state.temaActual];
  
  if (state.aplicarA === 'una') {
    const card = tarjetas.find(c => c.id === state.tarjetaSeleccionada);
    if (card) card.borde = state.bordeSeleccionado;
  } else if (state.aplicarA === 'todas') {
    tarjetas.forEach(c => c.borde = state.bordeSeleccionado);
  }
  
  renderCards();
  saveToStorage();
}

function aplicarCols() {
  if (!state.tarjetaSeleccionada) return;
  
  const tarjetas = state.datos[state.unidadActual][state.temaActual];
  const card = tarjetas.find(c => c.id === state.tarjetaSeleccionada);
  
  if (card) {
    const nuevoCols = state.colsSeleccionadas;
    const oldCols = card.cols;
    
    // Expande o contrae contenido
    if (nuevoCols > oldCols) {
      for (let i = oldCols; i < nuevoCols; i++) {
        card.contenido[i] = [''];
      }
    } else if (nuevoCols < oldCols) {
      card.contenido = card.contenido.slice(0, nuevoCols);
    }
    
    card.cols = nuevoCols;
  }
  
  renderCards();
  saveToStorage();
}

// ===== TOUCH HANDLERS =====
let activeTouchId = null;

function handleTouchStart(e) {
  if (e.touches.length === 1) {
    const touch = e.touches[0];
    const cardEl = document.elementFromPoint(touch.clientX, touch.clientY);
    if (cardEl?.classList.contains('card')) {
      activeTouchId = cardEl.dataset.id;
      selectCard(parseInt(activeTouchId));
    }
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchStartDistance = Math.sqrt(dx * dx + dy * dy);
  }
}

function handleTouchMove(e) {
  if (e.touches.length === 1 && activeTouchId) {
    e.preventDefault();
    const touch = e.touches[0];
    const tarjetas = state.datos[state.unidadActual][state.temaActual];
    const card = tarjetas.find(c => c.id === parseInt(activeTouchId));
    if (card) {
      card.x = touch.clientX - 60; // Offset aproximado
      card.y = touch.clientY - 40;
      renderCards();
    }
  } else if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const newDistance = Math.sqrt(dx * dx + dy * dy);
    const ratio = newDistance / (touchStartDistance || 1);
    
    const tarjetas = state.datos[state.unidadActual][state.temaActual];
    const card = tarjetas.find(c => c.id === state.tarjetaSeleccionada);
    if (card) {
      card.scale = Math.max(0.5, Math.min(2, card.scale * ratio));
    }
    touchStartDistance = newDistance;
    renderCards();
  }
}

function handleTouchEnd(e) {
  if (e.touches.length === 0) {
    activeTouchId = null;
    saveToStorage();
  }
}

// ===== EDITOR TOGGLE =====
function toggleEditor() {
  state.editorActivo = !state.editorActivo;
  document.getElementById('panelEditor').classList.toggle('hidden', !state.editorActivo);
  document.getElementById('btnToggleEditor').classList.toggle('active', state.editorActivo);
}

// ===== UI UPDATES =====
function updateBordeButtons() {
  document.querySelectorAll('[data-borde]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.borde === state.bordeSeleccionado);
  });
}

function updateColsButtons() {
  document.querySelectorAll('[data-cols]').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.cols) === state.colsSeleccionadas);
  });
}

function updateAplicarButtons() {
  document.getElementById('btnAplicarUna').classList.toggle('active', state.aplicarA === 'una');
  document.getElementById('btnAplicarTodas').classList.toggle('active', state.aplicarA === 'todas');
}

// ===== STORAGE =====
function saveToStorage() {
  localStorage.setItem('cuaderno-state', JSON.stringify(state.datos));
}

function loadFromStorage() {
  const saved = localStorage.getItem('cuaderno-state');
  if (saved) {
    state.datos = JSON.parse(saved);
  }
}

// ===== START =====
init();

</script>

</body>
</html>
