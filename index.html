<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1366, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Cuaderno</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --w: 1366px;
  --h: 100dvh;
  --header-h: 72px;
  
  --bg-app: #f0ebe5;
  --header-bg: #e9e9e7;
  --border-header: #d4d4d2;
  
  --sel-h: 44px;
  --sel-radius: 22px;
  --sel-border: 3.5px;
  --sel-color: #9a9a98;
  
  --card-radius: 16px;
  --card-padding: 16px;
  --card-border-w: 3.5px;
  --card-bg: #ffffff;
  
  --font: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
}

html, body {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg-app);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ===== HEADER / BARRA DE HERRAMIENTAS ===== */
header {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: var(--header-h);
  background: var(--header-bg);
  border-bottom: 1px solid var(--border-header);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  gap: 20px;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}

.selector {
  height: var(--sel-h);
  border-radius: var(--sel-radius);
  border: var(--sel-border) solid #c8c8c6;
  background: #ffffff;
  padding: 0 16px;
  font-size: 14px;
  color: var(--sel-color);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  text-transform: uppercase;
}

.selector:hover {
  border-color: #a8a8a6;
}

.selector.active {
  color: #2a2a28;
  border-color: #888886;
  background: #f9f9f7;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: var(--sel-border) solid #b8b8b6;
  background: #ffffff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.btn:hover {
  border-color: #888886;
  background: #f9f9f7;
}

.btn.active {
  border-color: #88cc00;
  background: #f0ff80;
  box-shadow: 0 0 8px rgba(136, 204, 0, 0.4);
}

/* ===== EDITOR BORDES ===== */
.editor-bordes {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border-left: 1px solid var(--border-header);
}

.borde-opcion {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 2px solid #d4d4d2;
  background: #ffffff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: all 0.15s;
}

.borde-opcion:hover {
  border-color: #888886;
}

.borde-opcion.active {
  border-color: #88cc00;
  background: #f0ff80;
  box-shadow: 0 0 8px rgba(136, 204, 0, 0.4);
}

/* ===== MESA / VIEWPORT ===== */
#mesa {
  position: absolute;
  top: var(--header-h);
  left: 0;
  width: 100%;
  height: calc(100dvh - var(--header-h));
  background: var(--bg-app);
  overflow: hidden;
  touch-action: none;
  perspective: 1000px;
}

/* ===== TARJETAS ===== */
.card {
  position: absolute;
  background: var(--card-bg);
  border-radius: var(--card-radius);
  padding: 16px 8px 8px 8px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  
  /* Default: borde simple gris */
  border: var(--card-border-w) solid #d4d4d2;
  
  /* Sombra sutil */
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  
  transition: box-shadow 0.1s, transform 0.1s;
}

.card:active {
  cursor: grabbing;
}

.card.selected {
  box-shadow: 0 0 12px rgba(136, 204, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.12);
}

/* Tipos de bordes predefinidos */
.card.borde-simple {
  border: var(--card-border-w) solid #d4d4d2;
}

.card.borde-punteado {
  border: var(--card-border-w) dashed #8a8a88;
}

.card.borde-doble {
  border: var(--card-border-w) double #b8b8b6;
}

.card.borde-grosor {
  border: 6px solid #6b6b69;
}

.card.borde-color-a {
  border: var(--card-border-w) solid #C85A54;
}

.card.borde-color-b {
  border: var(--card-border-w) solid #1E3A8A;
}

.card.borde-color-c {
  border: var(--card-border-w) solid #6FCF3D;
}

.card.borde-terreno {
  border: var(--card-border-w) solid transparent;
  background:
    linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
    linear-gradient(135deg, #8B7B6F, #D9CFC4) border-box;
}

.card.borde-flora {
  border: var(--card-border-w) solid transparent;
  background:
    linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
    linear-gradient(135deg, #6FCF3D, #C5EBA8) border-box;
}

.card.borde-verano {
  border: var(--card-border-w) solid transparent;
  background:
    linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
    linear-gradient(135deg, #f0d878, #f5e6b0) border-box;
}

.card.borde-clima {
  border: var(--card-border-w) solid transparent;
  background:
    linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
    conic-gradient(from 0deg, #ffffff 0deg, #b0b0ae 75deg, #8ec6e0 190deg, #f0d878 280deg, #f0a8c0 320deg, #ffffff 360deg) border-box;
}

.card.borde-terreno {
  border: var(--card-border-w) solid transparent;
  background:
    linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
    linear-gradient(135deg, #8B7B6F, #D9CFC4) border-box;
}

.card.borde-flora {
  border: var(--card-border-w) solid transparent;
  background:
    linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
    linear-gradient(135deg, #6FCF3D, #C5EBA8) border-box;
}

.card.borde-verano {
  border: var(--card-border-w) solid transparent;
  background:
    linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
    linear-gradient(135deg, #f0d878, #f5e6b0) border-box;
}

.card.borde-clima {
  border: var(--card-border-w) solid transparent;
  background:
    linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
    conic-gradient(from 0deg, #ffffff 0deg, #b0b0ae 75deg, #8ec6e0 190deg, #f0d878 280deg, #f0a8c0 320deg, #ffffff 360deg) border-box;
}

/* Contenedor de columnas */
.card-grid {
  display: grid;
  gap: 0px 4px;
  width: 100%;
}

.card-title {
  font-size: 14px;
  font-weight: 600;
  color: #2a2a28;
  margin-bottom: 8px;
  margin-top: -8px;
  padding: 0px 6px 6px 6px;
  border-radius: 0;
  background: transparent;
  border: none;
  border-bottom: 0.5px solid #d0d0ce;
  transition: all 0.15s;
  cursor: text;
  min-height: 20px;
  display: flex;
  align-items: center;
}

.card-title:hover {
  background: transparent;
  border-bottom-color: #888886;
}

.card-title:focus {
  outline: none;
  background: transparent;
  border-bottom-color: #88cc00;
}

.card-title[contenteditable="true"] {
  background: transparent;
  border-bottom-color: #88cc00;
}

.cell {
  background: transparent;
  border: none;
  border-bottom: 0.5px solid #d0d0ce;
  border-radius: 0;
  padding: 6px 12px;
  font-size: 12px;
  color: #2a2a28;
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  word-break: break-word;
  cursor: text;
  transition: all 0.15s;
  white-space: pre-wrap;
}

.cell:hover {
  background: transparent;
  border-bottom-color: #b8b8b6;
}

.cell:focus {
  outline: none;
  background: #fafaf8;
  border-bottom-color: #88cc00;
  box-shadow: 0 0 6px rgba(136, 204, 0, 0.2);
}

.cell[contenteditable="true"] {
  background: #fafaf8;
  border-bottom-color: #88cc00;
  padding: 4px 6px;
}

.card-grid {
  display: grid;
  gap: 0px 4px;
  width: 100%;
  grid-auto-columns: auto;
}

.cell-wrapper {
  display: contents;
}

.row-actions {
  display: flex;
  gap: 4px;
  justify-content: center;
  font-size: 10px;
  padding: 4px;
}

.row-actions button {
  padding: 2px 6px;
  border-radius: 3px;
  border: 0.5px solid #d4d4d2;
  background: #ffffff;
  font-size: 10px;
  cursor: pointer;
  transition: all 0.1s;
}

.row-actions button:hover {
  border-color: #888886;
  background: #f0f0ee;
}



/* ===== PANEL DERECHO (EDITOR DETALLES) ===== */
.panel-derecho {
  position: fixed;
  right: 0;
  top: var(--header-h);
  width: 280px;
  height: calc(100dvh - var(--header-h));
  background: #f9f9f7;
  border-left: 1px solid var(--border-header);
  padding: 16px;
  overflow-y: auto;
  z-index: 50;
  box-shadow: -2px 0 8px rgba(0, 0, 0, 0.05);
}

.panel-derecho.hidden {
  display: none;
}

.panel-section {
  margin-bottom: 20px;
}

.panel-label {
  font-size: 12px;
  font-weight: 700;
  color: #6a6a68;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.panel-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.panel-btn {
  flex: 1;
  min-width: 60px;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #d4d4d2;
  background: #ffffff;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}

.panel-btn:hover {
  border-color: #888886;
  background: #f0f0ee;
}

.panel-btn.active {
  border-color: #88cc00;
  background: #f0ff80;
  color: #3a3a38;
  font-weight: 600;
}

</style>

</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="header-left">
    <select id="selUnidad" class="selector">
      <option value="A">Unidad A</option>
      <option value="B">Unidad B</option>
      <option value="C">Unidad C</option>
    </select>
    
    <select id="selTema" class="selector">
      <option value="1">Tema 1</option>
      <option value="2">Tema 2</option>
    </select>
  </div>
  
  <div class="header-right">
    <button class="btn" id="btnAddCard" title="Agregar tarjeta">➕</button>
    <button class="btn" id="btnToggleEditor" title="Toggle editor">✏️</button>
  </div>
</header>

<!-- ===== PANEL EDITOR (DERECHA) ===== -->
<div class="panel-derecho hidden" id="panelEditor">
  <div class="panel-section">
    <div class="panel-label">Bordes</div>
    <div class="panel-buttons">
      <button class="panel-btn" data-borde="borde-simple">Simple</button>
      <button class="panel-btn" data-borde="borde-punteado">Punteado</button>
      <button class="panel-btn" data-borde="borde-doble">Doble</button>
      <button class="panel-btn" data-borde="borde-grosor">Grueso</button>
    </div>
    <div class="panel-label" style="margin-top: 12px;">Colores</div>
    <div class="panel-buttons">
      <button class="panel-btn" data-borde="borde-color-a">Rojo</button>
      <button class="panel-btn" data-borde="borde-color-b">Azul</button>
      <button class="panel-btn" data-borde="borde-color-c">Verde</button>
    </div>
    <div class="panel-label" style="margin-top: 12px;">Gradientes</div>
    <div class="panel-buttons">
      <button class="panel-btn" data-borde="borde-clima">Clima</button>
      <button class="panel-btn" data-borde="borde-terreno">Terreno</button>
      <button class="panel-btn" data-borde="borde-flora">Flora</button>
    </div>
  </div>
  
  <div class="panel-section">
    <div class="panel-label">Aplicar a</div>
    <div class="panel-buttons">
      <button class="panel-btn" id="btnAplicarUna">Esta tarjeta</button>
      <button class="panel-btn" id="btnAplicarTodas">Todas en tema</button>
    </div>
  </div>
  
  <div class="panel-section" id="seccionGridAbierta" style="display: none;">
    <div class="panel-label">Filas y Columnas</div>
    <div class="panel-buttons">
      <button class="panel-btn" id="btnAddRow">+ Fila</button>
      <button class="panel-btn" id="btnDelRow">- Fila</button>
      <button class="panel-btn" id="btnAddCol">+ Columna</button>
      <button class="panel-btn" id="btnDelCol">- Columna</button>
    </div>
  </div>
  
  <div class="panel-section" id="seccionBorrar" style="display: none;">
    <button class="panel-btn" id="btnBorrarTarjeta" style="width: 100%; background: #ffe6e6; border-color: #e24b4a; color: #a32d2d;">Borrar tarjeta</button>
  </div>
</div>

<!-- ===== MESA (VIEWPORT) ===== -->
<div id="mesa"></div>

<script>
// ===== CONFIG =====
const UNIDADES = ['A', 'B', 'C'];
const TEMAS_POR_UNIDAD = 2;
const BORDER_STYLES = [
  'borde-simple', 'borde-punteado', 'borde-doble', 'borde-grosor',
  'borde-color-a', 'borde-color-b', 'borde-color-c', 'borde-gradient'
];

// ===== STATE =====
let state = {
  unidadActual: 'A',
  temaActual: '1',
  editorActivo: false,
  tarjetaSeleccionada: null,
  bordeSeleccionado: null,
  colsSeleccionadas: 1,
  aplicarA: 'una', // 'una' o 'todas'
  
  // Datos: { [unidad]: { [tema]: [ { id, x, y, scale, borde, cols, contenido: [[], [], ...] } ] } }
  datos: {}
};

// ===== INIT =====
function init() {
  initData();
  renderCards();
  setupEventListeners();
}

function initData() {
  UNIDADES.forEach(u => {
    state.datos[u] = {};
    for (let i = 1; i <= TEMAS_POR_UNIDAD; i++) {
      state.datos[u][i] = [];
    }
  });
  loadFromStorage();
}

function setupEventListeners() {
  // Selectores
  document.getElementById('selUnidad').addEventListener('change', (e) => {
    state.unidadActual = e.target.value;
    state.tarjetaSeleccionada = null;
    renderCards();
  });
  
  document.getElementById('selTema').addEventListener('change', (e) => {
    state.temaActual = e.target.value;
    state.tarjetaSeleccionada = null;
    renderCards();
  });
  
  // Botones
  document.getElementById('btnAddCard').addEventListener('click', addCard);
  document.getElementById('btnToggleEditor').addEventListener('click', toggleEditor);
  
  // Panel editor - bordes
  document.querySelectorAll('[data-borde]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      state.bordeSeleccionado = e.target.dataset.borde;
      updateBordeButtons();
      // Aplicar inmediatamente
      if (state.tarjetaSeleccionada) {
        aplicarBorde();
      }
    });
  });
  
  // Panel editor - filas y columnas
  document.getElementById('btnAddRow').addEventListener('click', () => {
    if (!state.tarjetaSeleccionada) return;
    const tarjetas = state.datos[state.unidadActual][state.temaActual];
    const card = tarjetas.find(c => c.id === state.tarjetaSeleccionada);
    if (card) {
      card.contenido.push(new Array(card.cols).fill(''));
      renderCards();
      saveToStorage();
    }
  });
  
  document.getElementById('btnDelRow').addEventListener('click', () => {
    if (!state.tarjetaSeleccionada) return;
    const tarjetas = state.datos[state.unidadActual][state.temaActual];
    const card = tarjetas.find(c => c.id === state.tarjetaSeleccionada);
    if (card && card.contenido.length > 1) {
      card.contenido.pop();
      renderCards();
      saveToStorage();
    }
  });
  
  document.getElementById('btnAddCol').addEventListener('click', () => {
    if (!state.tarjetaSeleccionada) return;
    const tarjetas = state.datos[state.unidadActual][state.temaActual];
    const card = tarjetas.find(c => c.id === state.tarjetaSeleccionada);
    if (card) {
      card.cols++;
      card.contenido.forEach(row => row.push(''));
      renderCards();
      saveToStorage();
    }
  });
  
  document.getElementById('btnDelCol').addEventListener('click', () => {
    if (!state.tarjetaSeleccionada) return;
    const tarjetas = state.datos[state.unidadActual][state.temaActual];
    const card = tarjetas.find(c => c.id === state.tarjetaSeleccionada);
    if (card && card.cols > 1) {
      card.cols--;
      card.contenido.forEach(row => row.pop());
      renderCards();
      saveToStorage();
    }
  });
  
  document.getElementById('btnBorrarTarjeta').addEventListener('click', () => {
    if (!state.tarjetaSeleccionada) return;
    const tarjetas = state.datos[state.unidadActual][state.temaActual];
    const idx = tarjetas.findIndex(c => c.id === state.tarjetaSeleccionada);
    if (idx !== -1) {
      tarjetas.splice(idx, 1);
      state.tarjetaSeleccionada = null;
      document.getElementById('seccionGridAbierta').style.display = 'none';
      document.getElementById('seccionBorrar').style.display = 'none';
      renderCards();
      saveToStorage();
    }
  });
  
  // Panel editor - aplicar a
  document.getElementById('btnAplicarUna').addEventListener('click', () => {
    state.aplicarA = 'una';
    updateAplicarButtons();
  });
  
  document.getElementById('btnAplicarTodas').addEventListener('click', () => {
    state.aplicarA = 'todas';
    updateAplicarButtons();
  });
  
  // Mesa - pointer events
  const mesa = document.getElementById('mesa');
  mesa.addEventListener('pointerdown', onPointerDown);
  mesa.addEventListener('click', (e) => {
    // Si clickeás en la mesa directamente (no en una tarjeta), deselecciona
    if (e.target === mesa) {
      state.tarjetaSeleccionada = null;
      document.getElementById('seccionGridAbierta').style.display = 'none';
      document.getElementById('seccionBorrar').style.display = 'none';
      renderCards();
    }
  });
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerUp);
}

// ===== AGREGAR TARJETA =====
function addCard() {
  const tarjetas = state.datos[state.unidadActual][state.temaActual];
  const id = Date.now();
  const newCard = {
    id,
    x: 50 + Math.random() * 200,
    y: 100 + Math.random() * 200,
    scale: 1,
    borde: 'borde-simple',
    cols: 2,
    titulo: 'Nueva tarjeta',
    contenido: [
      ['', ''],
      ['', '']
    ]
  };
  tarjetas.push(newCard);
  selectCard(id);
  renderCards();
  saveToStorage();
}

// ===== RENDERIZAR =====
function renderCards() {
  const mesa = document.getElementById('mesa');
  mesa.innerHTML = '';
  
  const tarjetas = state.datos[state.unidadActual][state.temaActual] || [];
  
  // Ocultar sección si no hay tarjeta seleccionada
  if (!state.tarjetaSeleccionada) {
    document.getElementById('seccionGridAbierta').style.display = 'none';
  }
  
  tarjetas.forEach(card => {
    const cardEl = document.createElement('div');
    cardEl.className = `card ${card.borde}`;
    if (state.tarjetaSeleccionada === card.id) {
      cardEl.classList.add('selected');
    }
    
    cardEl.style.left = card.x + 'px';
    cardEl.style.top = card.y + 'px';
    cardEl.style.transform = `scale(${card.scale})`;
    cardEl.dataset.id = card.id;
    
    // Contenedor de contenido
    const contentContainer = document.createElement('div');
    
    // Título
    const title = document.createElement('div');
    title.className = 'card-title';
    title.contentEditable = 'false';
    title.spellcheck = 'false';
    title.textContent = card.titulo || 'Tarjeta ' + card.id;
    
    // Al clickear, pasar a editable
    title.addEventListener('click', (e) => {
      e.stopPropagation();
      title.contentEditable = 'true';
      title.focus();
    });
    
    title.addEventListener('blur', () => {
      title.contentEditable = 'false';
      card.titulo = title.textContent;
      saveToStorage();
    });
    
    title.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        title.blur();
      }
    });
    contentContainer.appendChild(title);
    
    // Grid
    const grid = document.createElement('div');
    grid.className = 'card-grid';
    grid.style.gridTemplateColumns = `repeat(${card.cols}, auto)`;
    
    const numFilas = card.contenido.length;
    for (let fila = 0; fila < numFilas; fila++) {
      for (let col = 0; col < card.cols; col++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.contentEditable = 'false';
        cell.spellcheck = 'false';
        // Cargar innerHTML para mostrar <br>
        cell.innerHTML = card.contenido[fila]?.[col] || '';
        cell.dataset.fila = fila;
        cell.dataset.col = col;
        
        // Al clickear, pasar a editable
        cell.addEventListener('click', (e) => {
          e.stopPropagation();
          cell.contentEditable = 'true';
          cell.focus();
        });
        
        cell.addEventListener('blur', () => {
          cell.contentEditable = 'false';
          if (!card.contenido[fila]) card.contenido[fila] = [];
          // Guardar innerHTML para preservar <br>
          card.contenido[fila][col] = cell.innerHTML;
          saveToStorage();
        });
        
        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') {
            e.preventDefault();
            const nextCol = col + 1;
            if (nextCol < card.cols) {
              const nextCell = grid.querySelector(`[data-fila="${fila}"][data-col="${nextCol}"]`);
              if (nextCell) nextCell.focus();
            }
          } else if (e.key === 'Enter') {
            e.preventDefault();
            // Insertar un <br> en lugar de crear un div
            document.execCommand('insertLineBreak');
          }
        });
        
        grid.appendChild(cell);
      }
    }
    
    contentContainer.appendChild(grid);
    cardEl.appendChild(contentContainer);
    
    // Eventos de la tarjeta
    cardEl.addEventListener('pointerdown', (e) => {
      // Si clickeás una celda, que se enfoque para editar
      if (e.target.classList.contains('cell')) {
        e.target.focus();
        return;
      }
      // Si clickeás el título, que se enfoque
      if (e.target.classList.contains('card-title')) {
        e.target.focus();
        return;
      }
      // Si clickeás en otro lado de la tarjeta, seleccioná la tarjeta
      selectCard(card.id);
    });
    
    mesa.appendChild(cardEl);
  });
}

// ===== SELECCIONAR TARJETA =====
function selectCard(id) {
  state.tarjetaSeleccionada = id;
  const tarjeta = state.datos[state.unidadActual][state.temaActual].find(c => c.id === id);
  if (tarjeta) {
    state.bordeSeleccionado = tarjeta.borde;
    state.colsSeleccionadas = tarjeta.cols;
    updateBordeButtons();
    updateColsButtons();
    document.getElementById('seccionGridAbierta').style.display = 'block';
    document.getElementById('seccionBorrar').style.display = 'block';
  }
  renderCards();
}

// ===== BORDES =====
function aplicarBorde() {
  if (!state.tarjetaSeleccionada || !state.bordeSeleccionado) return;
  
  const tarjetas = state.datos[state.unidadActual][state.temaActual];
  
  if (state.aplicarA === 'una') {
    const card = tarjetas.find(c => c.id === state.tarjetaSeleccionada);
    if (card) card.borde = state.bordeSeleccionado;
  } else if (state.aplicarA === 'todas') {
    tarjetas.forEach(c => c.borde = state.bordeSeleccionado);
  }
  
  renderCards();
  saveToStorage();
}

function aplicarCols() {
  if (!state.tarjetaSeleccionada) return;
  
  const tarjetas = state.datos[state.unidadActual][state.temaActual];
  const card = tarjetas.find(c => c.id === state.tarjetaSeleccionada);
  
  if (card) {
    const nuevoCols = state.colsSeleccionadas;
    const oldCols = card.cols;
    
    // Expande o contrae contenido
    if (nuevoCols > oldCols) {
      for (let i = oldCols; i < nuevoCols; i++) {
        card.contenido[i] = [''];
      }
    } else if (nuevoCols < oldCols) {
      card.contenido = card.contenido.slice(0, nuevoCols);
    }
    
    card.cols = nuevoCols;
  }
  
  renderCards();
  saveToStorage();
}

// ===== POINTER EVENTS (como Letritas) =====
const pointers = new Map();
let dragInfo = null;
let pinchInicial = null;
let modo = null;

function distanciaEntre(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

function escalaActual() {
  const tarjeta = document.querySelector(`[data-id="${state.tarjetaSeleccionada}"]`);
  if (!tarjeta) return 1;
  const match = tarjeta.style.transform.match(/scale\(([\d.]+)\)/);
  return match ? parseFloat(match[1]) : 1;
}

function aplicarEscala(cardId, escala) {
  const tarjeta = document.querySelector(`[data-id="${cardId}"]`);
  if (tarjeta) {
    tarjeta.style.transform = `scale(${escala})`;
  }
}

function onPointerDown(ev) {
  // Si estamos editando (contentEditable activo), no hacer nada
  if (document.activeElement?.contentEditable === 'true') return;
  
  const cardEl = ev.target.closest('.card');
  if (!cardEl) return;
  
  // Si el target es una celda o título, no iniciar drag
  if (ev.target.classList.contains('cell') || ev.target.classList.contains('card-title')) {
    return;
  }
  
  const cardId = parseInt(cardEl.dataset.id);
  selectCard(cardId);
  
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  
  if (pointers.size === 1) {
    ev.preventDefault();
    modo = 'arrastre';
    const mesa = document.getElementById('mesa');
    const rectMesa = mesa.getBoundingClientRect();
    const rectCard = cardEl.getBoundingClientRect();
    
    // Calcular offset desde el punto de toque al top-left de la tarjeta
    dragInfo = {
      cardId,
      startX: parseInt(cardEl.style.left) || 0,
      startY: parseInt(cardEl.style.top) || 0,
      touchStartX: ev.clientX,
      touchStartY: ev.clientY,
      maxX: rectMesa.width - rectCard.width,
      maxY: rectMesa.height - rectCard.height,
      rectMesa
    };
  } else if (pointers.size === 2) {
    ev.preventDefault();
    modo = 'pellizco';
    const pts = Array.from(pointers.values());
    pinchInicial = { 
      distancia: distanciaEntre(pts[0], pts[1]), 
      escala: escalaActual() 
    };
  }
}

function onPointerMove(ev) {
  if (!pointers.has(ev.pointerId)) return;
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  
  if (modo === 'arrastre' && pointers.size === 1 && dragInfo) {
    // Calcular delta desde el inicio del toque
    const deltaX = ev.clientX - dragInfo.touchStartX;
    const deltaY = ev.clientY - dragInfo.touchStartY;
    
    // Nueva posición = posición inicial + delta
    let newX = dragInfo.startX + deltaX;
    let newY = dragInfo.startY + deltaY;
    
    // Limitar dentro de la mesa
    newX = Math.max(0, Math.min(newX, dragInfo.maxX));
    newY = Math.max(0, Math.min(newY, dragInfo.maxY));
    
    const tarjetas = state.datos[state.unidadActual][state.temaActual];
    const card = tarjetas.find(c => c.id === dragInfo.cardId);
    if (card) {
      card.x = newX;
      card.y = newY;
      renderCards();
    }
  } else if (modo === 'pellizco' && pointers.size === 2 && pinchInicial) {
    const pts = Array.from(pointers.values());
    const factor = distanciaEntre(pts[0], pts[1]) / pinchInicial.distancia;
    const nueva = Math.min(2.5, Math.max(0.5, pinchInicial.escala * factor));
    
    const tarjetas = state.datos[state.unidadActual][state.temaActual];
    const card = tarjetas.find(c => c.id === state.tarjetaSeleccionada);
    if (card) {
      card.scale = nueva;
      renderCards();
    }
  }
}

function onPointerUp(ev) {
  pointers.delete(ev.pointerId);
  
  if (modo === 'arrastre' && dragInfo) {
    saveToStorage();
  } else if (modo === 'pellizco') {
    saveToStorage();
  }
  
  if (pointers.size < 2) {
    modo = null;
    dragInfo = null;
    pinchInicial = null;
  }
}

// ===== EDITOR TOGGLE =====
function toggleEditor() {
  state.editorActivo = !state.editorActivo;
  document.getElementById('panelEditor').classList.toggle('hidden', !state.editorActivo);
  document.getElementById('btnToggleEditor').classList.toggle('active', state.editorActivo);
}

// ===== UI UPDATES =====
function updateBordeButtons() {
  document.querySelectorAll('[data-borde]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.borde === state.bordeSeleccionado);
  });
}

function updateColsButtons() {
  document.querySelectorAll('[data-cols]').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.cols) === state.colsSeleccionadas);
  });
}

function updateAplicarButtons() {
  document.getElementById('btnAplicarUna').classList.toggle('active', state.aplicarA === 'una');
  document.getElementById('btnAplicarTodas').classList.toggle('active', state.aplicarA === 'todas');
}

// ===== STORAGE =====
function saveToStorage() {
  localStorage.setItem('cuaderno-state', JSON.stringify(state.datos));
}

function loadFromStorage() {
  const saved = localStorage.getItem('cuaderno-state');
  if (saved) {
    state.datos = JSON.parse(saved);
  }
}

// ===== START =====
init();

</script>
